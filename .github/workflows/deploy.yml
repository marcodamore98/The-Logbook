name: Pubblica su GitHub Pages

# Pubblica a ogni push sul branch predefinito e sul branch di prova.
# L'app principale va su /<repo>/, la versione di prova su /<repo>/prova/.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

env:
  TEST_BRANCH: claude/prova-navigazione

jobs:
  # Only the default branch may deploy to Pages: a push on the test branch asks it to rebuild.
  trigger:
    if: github.ref_name == 'claude/prova-navigazione'
    runs-on: ubuntu-latest
    steps:
      - run: gh workflow run deploy.yml --repo "${{ github.repository }}" --ref "${{ github.event.repository.default_branch }}"
        env:
          GH_TOKEN: ${{ github.token }}
  build:
    if: github.ref_name == github.event.repository.default_branch
    concurrency:
      group: pages
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # La configurazione Firebase è in src/lib/config.ts: non servono secrets.
      - name: App principale
        working-directory: main
        run: npm ci && npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - name: Scarica la versione di prova (se esiste)
        id: test
        run: |
          if git ls-remote --exit-code --heads "https://github.com/${{ github.repository }}.git" "$TEST_BRANCH" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.test.outputs.exists == 'true'
        with:
          ref: ${{ env.TEST_BRANCH }}
          path: prova
      - name: Versione di prova
        if: steps.test.outputs.exists == 'true'
        working-directory: prova
        run: npm ci && npm run build && cp -r dist ../main/dist/prova
        env:
          BASE_PATH: /${{ github.event.repository.name }}/prova/
          APP_VARIANT: prova
      - uses: actions/upload-pages-artifact@v3
        with:
          path: main/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
